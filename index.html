<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Countdown bis zum 22. August 2025</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      text-align: center;
      padding-top: 100px;
    }

    #countdown {
      font-size: 48px;
      color: #333;
      margin-top: 30px;
    }

    #startButton {
      font-size: 24px;
      padding: 10px 20px;
      border: none;
      background-color: #333;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }

    #startButton:hover {
      background-color: #555;
    }
  </style>
</head>
<body>
  <h1>Countdown bis zum 22. August 2025</h1>
  <button id="startButton">Start</button>
  <div id="countdown" style="display:none;"></div>

  <!-- Audio-Element -->
  <audio id="backgroundMusic" loop>
    <source src="Vier Jungs und ein Sommertraum.mp3" type="audio/mpeg">
    Dein Browser unterstützt das Audio-Element nicht.
  </audio>

  <script>
    const countdownElement = document.getElementById('countdown');
    const startButton = document.getElementById('startButton');
    const audio = document.getElementById('backgroundMusic');
    const targetDate = new Date('2025-08-22T00:00:00');

    function updateCountdown() {
      const now = new Date();
      const difference = targetDate - now;

      if (difference <= 0) {
        countdownElement.textContent = "Es ist so weit!";
        return;
      }

      const days = Math.floor(difference / (1000 * 60 * 60 * 24));
      const hours = Math.floor((difference / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((difference / (1000 * 60)) % 60);
      const seconds = Math.floor((difference / 1000) % 60);

      countdownElement.textContent = `${days} Tage, ${hours} Std, ${minutes} Min, ${seconds} Sek`;
    }

    // Start-Button aktiviert Musik und Countdown
    startButton.addEventListener('click', () => {
      audio.play().catch(e => {
        alert('Autoplay wurde blockiert. Bitte überprüfe deine Browsereinstellungen.');
      });
      startButton.style.display = 'none';
      countdownElement.style.display = 'block';
      setInterval(updateCountdown, 1000);
      updateCountdown();
    });
  </script>
</body>
</html>
